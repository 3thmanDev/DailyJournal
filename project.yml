name: DailyJournal

options:
  bundleIdPrefix: com.app
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  DailyJournal:
    type: application
    platform: iOS
    sources:
      - path: DailyJournal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.app.dailyjournal
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: Support/Info.plist

schemes:
  DailyJournal:
    build:
      targets:
        DailyJournal: all
    run:
      config: Debug
    archive:
      config: Release
